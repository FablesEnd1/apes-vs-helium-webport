<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apes vs Helium — WebGL 1 Test</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#231F20; }
    .webgl-content { position:fixed!important; inset:0!important; transform:none!important; width:100vw!important; height:100vh!important; margin:0!important; }
    #unityContainer { position:absolute; inset:0; width:100vw!important; height:100vh!important; overflow:hidden; }
    #unityContainer canvas { width:100%!important; height:100%!important; display:block; }
    #fullscreenButton { position:fixed; right:12px; top:12px; z-index:20; padding:9px 14px; color:white; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.4); border-radius:5px; cursor:pointer; }
    #testLabel { position:fixed; left:12px; top:12px; z-index:20; padding:7px 10px; color:white; background:rgba(0,0,0,.6); font:13px Arial,sans-serif; }
  </style>
</head>
<body>
  <div id="testLabel">Graphics test: WebGL 1.0</div>
  <div class="webgl-content"><div id="unityContainer"></div></div>
  <button id="fullscreenButton" onclick="goFullscreen()">Fullscreen</button>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    window.unityInstance = UnityLoader.instantiate("unityContainer", "Build/webglboii-webgl1.json", {
      onProgress: UnityProgress
    });
    function goFullscreen() {
      if (window.unityInstance) window.unityInstance.SetFullscreen(1);
    }
  </script>
</body>
</html>
