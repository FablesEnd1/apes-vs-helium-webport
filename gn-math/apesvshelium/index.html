<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Apes vs Helium - GN-Math build</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #231F20;
    }
    #unityContainer {
      position: absolute;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
    }
    #loadError {
      position: fixed;
      z-index: 9999;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 12px;
      color: white;
      background: #8b0000;
      font: 14px/1.4 Arial, sans-serif;
      white-space: pre-wrap;
      display: none;
    }
  </style>
  <script>
    window.fileMergerConfig = {
      files: [
        { name: 'AVHPort.data.unityweb', parts: 3 },
        { name: 'AVHPort.wasm.code.unityweb', parts: 2 }
      ],
      basePath: 'Build/',
      debug: true
    };
    window.addEventListener('error', function (event) {
      var box = document.getElementById('loadError');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'GAME ERROR: ' + (event.message || 'Unknown JavaScript error');
      }
    });
    window.addEventListener('unhandledrejection', function (event) {
      var box = document.getElementById('loadError');
      if (box) {
        box.style.display = 'block';
        box.textContent = 'GAME ERROR: ' + (event.reason && (event.reason.stack || event.reason.message) || event.reason || 'Unknown loading error');
      }
    });
  </script>
  <script src="merge.js"></script>
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>
  <script>
    window.addEventListener('load', function () {
      try {
        window.unityInstance = UnityLoader.instantiate('unityContainer', 'Build/AVHPort.json', {
          onProgress: UnityProgress
        });
      } catch (error) {
        var box = document.getElementById('loadError');
        box.style.display = 'block';
        box.textContent = 'GAME START ERROR: ' + (error.stack || error.message || error);
      }
    });
  </script>
</head>
<body>
  <div id="unityContainer"></div>
  <div id="loadError"></div>
</body>
</html>
